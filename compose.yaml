services:
  postgres:
    image: postgres:18
    container_name: jobtrack-postgres
    environment:
      POSTGRES_USER: jobtrack
      POSTGRES_PASSWORD: jobtrack
      POSTGRES_DB: jobtrack
    ports:
      - "5432:5432"
    volumes:
      - jobtrack-postgres-data:/var/lib/postgresql

volumes:
  jobtrack-postgres-data:
